<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MOP File Tracking System</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 50px 40px;
            max-width: 450px;
            width: 100%;
        }

        .logo-section {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo-section h1 {
            color: #333;
            font-size: 2rem;
            margin-bottom: 5px;
            font-weight: 700;
        }

        .logo-section p {
            color: #667eea;
            font-size: 1rem;
            font-weight: 500;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn-login {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.95rem;
        }

        .alert-error {
            background: #ffebee;
            border-left: 4px solid #f44336;
            color: #c62828;
        }

        .alert-success {
            background: #e8f5e9;
            border-left: 4px solid #4caf50;
            color: #2e7d32;
        }

        .footer-text {
            text-align: center;
            margin-top: 30px;
            color: #999;
            font-size: 0.9rem;
        }

        /* ── Input Icons ── */
        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
            font-size: 0.9rem;
            transition: color 0.3s;
        }

        .input-wrapper input {
            padding-left: 42px !important;
        }

        .input-wrapper input:focus+i {
            color: #667eea;
        }

        /* ── Mobile Responsive ── */
        @media (max-width: 480px) {
            body {
                padding: 15px;
                background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
                display: flex;
                align-items: center;
                justify-content: center;
                min-height: 100dvh;
                /* Better for mobile browser bars */
                margin: 0;
                overflow: hidden;
                /* Prevent scrolling if centered */
            }

            .login-container {
                padding: 30px 20px;
                border-radius: 15px;
                margin: 0;
                max-width: 90%;
                /* Ensure it doesn't hit edges on very small screens */
            }

            .logo-section {
                margin-bottom: 25px;
            }

            .logo-section h1 {
                font-size: 1.6rem;
            }

            .logo-section p {
                font-size: 0.85rem;
            }

            .btn-login {
                padding: 12px;
                font-size: 1rem;
            }

            .form-group {
                margin-bottom: 18px;
            }

            .form-group label {
                font-size: 0.85rem;
                margin-bottom: 6px;
            }

            .form-group input {
                padding: 11px 14px;
                font-size: 0.95rem;
            }
        }
    </style>
    <script type="text/javascript">
        // Prevent back-navigation to this page
        function preventBack() {
            window.history.forward();
        }
        setTimeout(preventBack, 0);
        window.onunload = function () { };
    </script>

    {% if request.user.is_authenticated %}
    <script type="text/javascript">
        // Redirect if already authenticated
        window.location.replace("{% url 'dashboard' %}");
    </script>
    {% endif %}
</head>

<body>
    <div class="login-container">
        <div class="logo-section">
            <h1>MOP System</h1>
            <p>Manual of Office Procedure</p>
        </div>

        <!-- <div class="system-info">
            <p><strong>File Tracking & Workflow Management</strong></p>
            <p>Secure Login Portal</p>
        </div> -->

        {% if messages %}
        {% for message in messages %}
        <div class="alert alert-{{ message.tags }}">
            {{ message }}
        </div>
        {% endfor %}
        {% endif %}

        <form method="POST" action="{% url 'login' %}" autocomplete="off">
            {% csrf_token %}

            <div class="form-group">
                <label for="username">Username</label>
                <div class="input-wrapper">
                    <input type="text" id="username" name="username" required autofocus
                        placeholder="Enter your username" autocomplete="off">
                    <i class="fas fa-user"></i>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <input type="password" id="password" name="password" required placeholder="Enter your password"
                        autocomplete="new-password">
                    <i class="fas fa-lock"></i>
                </div>
            </div>

            <button type="submit" class="btn-login">Login</button>
        </form>

        <!-- <div class="footer-text">
            <p>Access restricted to authorized personnel only</p>
        </div> -->
    </div>
</body>

</html>
